name: "Epic"
description: 하나의 사용자/시스템 결과를 만들기 위한 작업 묶음
title: "[EPIC] "
labels: ["epic"]

body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: 지금 어떤 문제가 있고, 왜 이 작업이 필요한지 적습니다.
      placeholder: |
        현재 잔액은 WalletBalance에 저장되지만 거래의 원본 기록은 LedgerEntry에 남는다.
        두 값이 어긋났을 때 이를 발견할 방법이 없어 운영 중 정합성을 보장하기 어렵다.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 구현할 기능이 아니라, 완료 후 가능해지는 상태를 적습니다.
      placeholder: |
        Ledger를 기준으로 잔액 불일치를 탐지하고,
        실패 원인을 추적할 수 있는 대사 흐름을 만든다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 이번 Epic에서 다룰 작업입니다.
      placeholder: |
        - 잔액 대사
        - 대사 결과 기록
        - 실패 관측
        - 통합 테스트
        - Demo / README

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: 이 Epic을 닫을 수 있는 조건입니다.
      placeholder: |
        - [ ] Ledger와 WalletBalance 불일치를 탐지할 수 있다.
        - [ ] 대사를 반복 실행해도 결과가 달라지지 않는다.
        - [ ] 실패한 대상을 로그/지표로 식별할 수 있다.
        - [ ] 정상/불일치 시나리오가 통합 테스트로 검증된다.
        - [ ] Demo Script로 동작을 재현할 수 있다.
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: Work
      description: 구현하면서 Child Issue를 연결합니다.
      placeholder: |
        - [ ] #39 Reconciliation
        - [ ] #41 Integration Test
        - [ ] #40 Demo / README

  - type: textarea
    id: non_goal
    attributes:
      label: Not doing
      description: 이번 작업에서 의도적으로 하지 않는 것만 적습니다.
      placeholder: |
        - 불일치 잔액 자동 보정
        - 운영자 Admin UI