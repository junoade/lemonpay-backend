name: "Bug"
description: "기대 동작과 실제 동작이 다른 문제를 재현하고 수정한다"
title: "[BUG] "
labels: ["bug"]

body:
  - type: input
    id: parent
    attributes:
      label: Parent
      description: 관련 Epic 또는 Feature가 있으면 연결한다.
      placeholder: "#36 / None"

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 기대한 동작과 실제 동작의 차이를 적는다.
      placeholder: |
        Expected:
        - 실패한 결제는 잔액에 반영되지 않아야 한다.

        Actual:
        - 특정 실패 응답에서 잔액이 차감된 채 남는다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: 문제를 다시 발생시키는 최소 절차를 적는다.
      placeholder: |
        1. 잔액 10,000원인 지갑을 준비한다.
        2. 결제 요청을 보낸다.
        3. 외부 승인 단계에서 실패를 발생시킨다.
        4. WalletBalance와 LedgerEntry를 확인한다.
    validations:
      required: true

  - type: textarea
    id: cause
    attributes:
      label: Cause
      description: 조사 후 확인된 원인을 적는다. 이슈 생성 시 모르면 비워둔다.
      placeholder: |
        - 확인된 원인:
        - 영향 범위:

  - type: textarea
    id: fix
    attributes:
      label: Fix
      description: 수정 방향과 중요한 설계 판단을 적는다. 조사 전에는 비워둔다.
      placeholder: |
        - 수정:
        - 고려한 대안:
        - Trade-off:
        - ADR: N/A

  - type: textarea
    id: verification
    attributes:
      label: Done when
      description: 버그가 수정되었음을 검증할 수 있는 조건을 적는다.
      value: |
        - [ ] 재현 테스트가 수정 전 실패하고 수정 후 통과한다.
        - [ ] 기존 정상 시나리오에 회귀가 없다.
        - [ ] 실패 후 데이터 상태가 기대한 invariant를 만족한다.
    validations:
      required: true

  - type: textarea
    id: observability
    attributes:
      label: Observability
      description: 운영 중 같은 문제가 다시 발생하면 어떻게 발견할지 적는다. 필요 없으면 N/A.
      placeholder: |
        - Log:
        - Metric:
        - N/A: